<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudhir Study Hub - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            min-height: 100vh;
        }

        .header {
            background: #1769aa;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .15);
        }

        h2 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f80;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            text-align: center;
        }

        .info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>


<body>


    <div class="header">
        <h1>🎓 Sudhir Study Hub</h1>
    </div>


    <div class="container">

        <div class="login-box">

            <h2>🔐 Participant Login</h2>

            <p style="text-align:center;">
                Enter the Participant ID and Password received
                after registration.
            </p>


            <label>
                Participant ID
            </label>

            <input type="text" id="participantId" placeholder="Enter Participant ID">


            <label>
                Password
            </label>

            <input type="password" id="password" placeholder="Enter Password">


            <button onclick="login()">
                Login
            </button>


            <div class="error" id="error">
                ❌ Invalid Participant ID or Password.
            </div>


            <div class="info">
                💡 Use the exact ID and Password generated
                during registration.
            </div>

        </div>

    </div>



    <script>

        function login() {

            /* Get entered values */

            var enteredId =
                document.getElementById(
                    "participantId"
                ).value.trim();


            var enteredPassword =
                document.getElementById(
                    "password"
                ).value.trim();


            /* Get registered values */

            var savedId =
                localStorage.getItem(
                    "participantId"
                );


            var savedPassword =
                localStorage.getItem(
                    "participantPassword"
                );


            /* Check login */

            if (
                enteredId === savedId &&
                enteredPassword === savedPassword
            ) {

                /* Login successful */

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                window.location.href =
                    "instructions.html";

            }
            else {

                document.getElementById(
                    "error"
                ).style.display =
                    "block";

            }

        }

    </script>


</body>

</html>
